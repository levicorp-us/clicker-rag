<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>클리커 · 문서 작업실</title>
    <link rel="stylesheet" href="/static/style.css" />

    <script defer src="/static/app.js"></script>
